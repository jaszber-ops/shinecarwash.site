<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHINE Halloween Bash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070b1c;
      --panel: rgba(12, 10, 24, 0.72);
      --line: rgba(255, 255, 255, 0.12);
      --ink: #f4eee6;
      --muted: rgba(244, 238, 230, 0.62);
      --pumpkin: #ef740b;
      --candle: #ffc247;
      --purple: #8b5cf6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; }
    #ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    h1 { margin: 0; font-family: Creepster, Inter, sans-serif; font-weight: 400; font-size: clamp(32px, 6vw, 64px); line-height: 0.95; color: var(--pumpkin); letter-spacing: 1px; text-shadow: 0 0 18px rgba(239, 116, 11, 0.55), 0 2px 0 #000; }
    .sub { margin-top: 6px; font-size: 13px; color: var(--muted); max-width: 34ch; }
    a.back { pointer-events: auto; color: var(--muted); font-size: 13px; text-decoration: none; border: 1px solid var(--line); padding: 8px 12px; border-radius: 999px; background: var(--panel); backdrop-filter: blur(8px); white-space: nowrap; }
    a.back:hover { color: var(--ink); }
    .panel { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; backdrop-filter: blur(10px); display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; max-width: 100%; align-self: center; }
    .group { display: flex; flex-direction: column; gap: 6px; }
    .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; gap: 6px; }
    button { font: 600 13px Inter, sans-serif; color: var(--ink); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
    button:hover { background: rgba(255, 255, 255, 0.12); }
    button[aria-pressed="true"] { background: var(--pumpkin); border-color: var(--pumpkin); color: #1a0d02; }
    #treat { background: var(--purple); border-color: var(--purple); }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 5; transition: opacity 0.6s; }
    #loading div { text-align: center; }
    #loading .big { font-family: Creepster, Inter, sans-serif; font-size: 42px; color: var(--pumpkin); }
    #loading .small { color: var(--muted); font-size: 13px; margin-top: 8px; }
    #toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); font-family: Creepster, Inter, sans-serif; font-size: clamp(28px, 5vw, 48px); color: var(--candle); text-shadow: 0 0 20px rgba(255, 194, 71, 0.7); opacity: 0; transition: opacity 0.4s; pointer-events: none; text-align: center; }
    .credit { font-size: 11px; color: var(--muted); text-align: center; margin-top: 8px; pointer-events: auto; }
    .credit a { color: var(--muted); }
    @media (max-width: 640px) {
      .sub { display: none; }
      .panel { gap: 10px 14px; padding: 10px; }
      button { padding: 6px 10px; font-size: 12px; }
    }
  </style>
  <script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
  } }
  </script>
</head>
<body>
  <div id="loading"><div><div class="big">Summoning the guests…</div><div class="small" id="progress">0 / 0</div></div></div>
  <div id="toast"></div>
  <div id="ui">
    <div class="top">
      <div>
        <h1>SHINE<br />Halloween Bash</h1>
        <div class="sub">Haunted house, costume dance floor and a bubbling cauldron. Drag to look around, scroll to zoom.</div>
      </div>
      <a class="back" href="/">← Back to SHINE</a>
    </div>
    <div>
      <div class="panel">
        <div class="group">
          <span class="label">Dance</span>
          <div class="row" id="dances"></div>
        </div>
        <div class="group">
          <span class="label">Sky</span>
          <div class="row" id="skies"></div>
        </div>
        <div class="group">
          <span class="label">Party</span>
          <div class="row">
            <button id="spin" aria-pressed="true">Orbit</button>
            <button id="treat">Trick or treat!</button>
          </div>
        </div>
      </div>
      <div class="credit">3D models by <a href="https://polyfork.dev/kit/halloween-night-46ade4" target="_blank" rel="noopener">Polyfork · Halloween Night</a></div>
    </div>
  </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { stage } from 'https://polyfork.dev/cdn/stage.mjs';
import { animate } from 'https://polyfork.dev/cdn/clips.mjs';

const CDN = 'https://polyfork.dev/cdn/';

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(10.5, 6, 13.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.4, -2);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 4;
controls.maxDistance = 45;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;

const look = stage(renderer, scene, { time: 'night', shadowSpan: 48 });
look.follow(new THREE.Object3D()); // keep the shadow map centred on the party (origin)

// ---------- loading helpers ----------
const mods = new Map();
let total = 0, done = 0;
const progress = document.getElementById('progress');
const tick = () => { progress.textContent = `${done} / ${total} spooky things`; };

function loadModule(id) {
  if (!mods.has(id)) mods.set(id, import(`${CDN}${id}.mjs`));
  return mods.get(id);
}

/* Night glow. Each asset's `night` export names colour zones (a param of type colour)
 * that light up after dark. Pull those triangles out into an unlit overlay mesh,
 * so candles, bulbs and lamps actually glow regardless of the scene lights. */
const glowMaterials = [];
function addNightGlow(mod, root, overrides) {
  const night = mod.night;
  if (!night || !mod.params) return;
  const zones = [];
  for (const [key, z] of Object.entries(night)) {
    const p = mod.params[key];
    const hex = overrides[key] ?? z.albedo ?? (p && p.default);
    if (!hex) continue;
    zones.push({ albedo: new THREE.Color(hex), color: new THREE.Color(z.color || hex), intensity: z.intensity ?? 1 });
  }
  if (!zones.length) return;
  const meshes = [];
  root.traverse((o) => { if (o.isMesh && o.geometry?.attributes?.color) meshes.push(o); });
  const c = new THREE.Color();
  for (const mesh of meshes) {
    const g = mesh.geometry.index ? mesh.geometry.toNonIndexed() : mesh.geometry;
    const pos = g.attributes.position, col = g.attributes.color;
    for (const zone of zones) {
      const out = [];
      for (let i = 0; i < pos.count; i += 3) {
        c.fromBufferAttribute(col, i);
        if (Math.abs(c.r - zone.albedo.r) + Math.abs(c.g - zone.albedo.g) + Math.abs(c.b - zone.albedo.b) > 0.04) continue;
        for (let k = 0; k < 3; k++) out.push(pos.getX(i + k), pos.getY(i + k), pos.getZ(i + k));
      }
      if (!out.length) continue;
      const gg = new THREE.BufferGeometry();
      gg.setAttribute('position', new THREE.Float32BufferAttribute(out, 3));
      const mat = new THREE.MeshBasicMaterial({
        color: zone.color.clone().multiplyScalar(0.75 + zone.intensity * 0.5),
        polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -4, fog: false,
      });
      mat.userData.base = mat.color.clone();
      glowMaterials.push(mat);
      const glow = new THREE.Mesh(gg, mat);
      glow.name = 'night-glow';
      glow.raycast = () => {};
      mesh.add(glow);
    }
  }
}

async function place(id, { at = [0, 0, 0], ry = 0, params = {}, glow = true } = {}) {
  total++; tick();
  try {
    const mod = await loadModule(id);
    const obj = mod.createAsset(params);
    obj.position.set(...at);
    obj.rotation.y = THREE.MathUtils.degToRad(ry);
    obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    if (glow) addNightGlow(mod, obj, params);
    scene.add(obj);
    return obj;
  } catch (err) {
    console.warn(`Could not load ${id}`, err);
    return null;
  } finally { done++; tick(); }
}

// ---------- ground ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(120, 48).rotateX(-Math.PI / 2),
  new THREE.MeshLambertMaterial({ color: 0x2f3a1c })
);
ground.position.y = -0.02;
ground.receiveShadow = true;
scene.add(ground);

const jobs = [];
const P = (...a) => { const p = place(...a); jobs.push(p); return p; };

// Lawn tiles under the party, cemetery tiles at the back left
for (let x = -12; x <= 12; x += 4) for (let z = -8; z <= 12; z += 4) {
  const patch = x >= 8 && z >= -4 && z <= 4; // a little pumpkin patch beside the farm stand
  P(patch ? 'pumpkin-patch-tile-b5e5de' : 'cemetery-lawn-tile-5c12ca', { at: [x, 0, z], ry: ((x + z) / 4 % 4) * 90, glow: false });
}

// ---------- the haunted house (backdrop) ----------
P('haunted-victorian-house-886931', { at: [0, 0, -18] });
P('mossy-stone-steps-1beb4d', { at: [0, 0, -10.5] });
P('porch-cobweb-drape-6c2f0f', { at: [-4.5, 0, -11.2] });
P('porch-pumpkin-display-bbc997', { at: [2.4, 0, -10.6] });
P('porch-pumpkin-display-bbc997', { at: [-2.4, 0, -10.6] });
P('potted-autumn-mums-08db8c', { at: [3.4, 0, -10.4] });
P('potted-autumn-mums-08db8c', { at: [-3.4, 0, -10.4] });

// ---------- dance floor: string-light canopy on lantern posts ----------
const S = 4; // half-size of the canopy square
for (const [x, z] of [[-S, -S], [S, -S], [-S, S], [S, S]]) P('cemetery-lantern-post-fed352', { at: [x, 0, z] });
const stringRuns = [];
for (let i = 0; i < 2; i++) {
  const off = -S + 2 + i * 4;
  stringRuns.push(
    P('orange-and-purple-string-1fbdab', { at: [off, 2.35, -S], params: { colorway: 'witch-purple' } }),
    P('orange-and-purple-string-1fbdab', { at: [off, 2.35, S], ry: 180, params: { colorway: 'witch-purple' } }),
    P('orange-and-purple-string-1fbdab', { at: [-S, 2.35, off], ry: 90, params: { colorway: 'witch-purple' } }),
    P('orange-and-purple-string-1fbdab', { at: [S, 2.35, off], ry: -90, params: { colorway: 'witch-purple' } }),
  );
}
// a cross of lights over the middle
P('orange-and-purple-string-1fbdab', { at: [-2, 2.45, 0] });
P('orange-and-purple-string-1fbdab', { at: [2, 2.45, 0] });

// ring of jack-o'-lanterns round the floor
const faces = ['classic', 'scary', 'goofy', 'cat'];
const rinds = ['classic', 'cinderella', 'ghost', 'witch-purple'];
for (let i = 0; i < 14; i++) {
  const a = (i / 14) * Math.PI * 2;
  const r = 5.4;
  P('jack-o-lantern-0b1ddb', {
    at: [Math.sin(a) * r, 0, Math.cos(a) * r],
    ry: THREE.MathUtils.radToDeg(a) + 180,
    params: { face: faces[i % 4], colorway: rinds[(i * 3) % 4] },
  });
}

// ---------- the guests ----------
const DANCES = ['Thriller', 'Twist', 'Hip hop', 'Swing'];
let currentDance = 'Thriller';
const dancers = [];
const others = [];
const guests = [
  { id: 'teen-zombie-b5bb27',          at: [0, 0, -1.6], ry: 0,    role: 'lead' },
  { id: 'kid-witch-01c770',            at: [-2.2, 0, 0.4], ry: 15, role: 'dance' },
  { id: 'kid-in-a-skeleton-6bb49d',    at: [2.2, 0, 0.4], ry: -15, role: 'dance' },
  { id: 'kid-in-a-pumpkin-169f79',     at: [-1.1, 0, 1.6], ry: 5,  role: 'dance' },
  { id: 'kid-in-a-bedsheet-f9c403',    at: [1.1, 0, 1.6], ry: -5,  role: 'dance' },
  { id: 'kid-in-a-caped-663f11',       at: [-2.6, 0, -1.8], ry: 25, role: 'dance' },
  { id: 'kid-in-a-black-2e5f87',       at: [2.6, 0, -1.8], ry: -25, role: 'dance' },
  { id: 'neighbour-handing-out-candy-2c1159', at: [6.6, 0, -5.4], ry: -35, role: 'Idle' },
  { id: 'parent-chaperone-79e535',     at: [-6.4, 0, -3.6], ry: 40, role: 'Drinking' },
  { id: 'pumpkin-stand-keeper-77ced9', at: [11.8, 0, -1.2], ry: -100, role: 'Laughing' },
];
const mixers = [];
for (const g of guests) {
  jobs.push(place(g.id, { at: g.at, ry: g.ry }).then(async (obj) => {
    if (!obj) return;
    try {
      const clips = g.role === 'dance' || g.role === 'lead' ? ['Idle', ...DANCES] : ['Idle', g.role];
      const anim = await animate(obj, { clips });
      mixers.push(anim);
      if (g.role === 'dance' || g.role === 'lead') {
        dancers.push(anim);
        anim.play(currentDance, { fade: 0 });
        anim.mixer.setTime(Math.random() * 0.4); // a little out of sync, like real kids
      } else {
        anim.play(g.role, { fade: 0 });
        others.push(anim);
      }
    } catch (err) { console.warn(`No clips for ${g.id}`, err); }
  }));
}

// ---------- party stations ----------
P('bubbling-tripod-cauldron-124e15', { at: [-5.6, 0, 2.6], ry: 60 });
P('apple-bobbing-tub-d1872e', { at: [5.4, 0, 2.8], ry: -60 });
P('please-take-one-candy-2eed38', { at: [5.8, 0, -4.4] });
P('pile-of-wrapped-candy-7fe300', { at: [6.6, 0, -4.2] });
P('porch-straw-bale-c47f80', { at: [7.6, 0, -2.6], ry: -90 });
P('porch-straw-bale-c47f80', { at: [-7.4, 0, -1.4], ry: 90 });
P('arched-black-cat-407cf6', { at: [7.6, 0.42, -2.6], ry: -70 });
P('yard-fog-machine-1fa049', { at: [-1.8, 0, 6.6], ry: 20 });
P('pumpkin-bin-5177e8', { at: [11.2, 0, 4.6] });
P('pumpkin-patch-farm-stand-5c30be', { at: [13.6, 0, 0], ry: -90 });
P('hand-painted-arrow-sign-883df2', { at: [1.8, 0, 10.6], ry: 200 });

// path of luminarias up to the floor
for (let z = 7; z <= 14; z += 1.4) {
  P('paper-bag-luminaria-0e8a1a', { at: [-1.4, 0, z] });
  P('paper-bag-luminaria-0e8a1a', { at: [1.4, 0, z] });
}

// ---------- yard scares ----------
P('giant-yard-skeleton-770f04', { at: [8.6, 0, -9.4], ry: -30 });
P('twisted-dead-oak-49457b', { at: [-13, 0, 2], ry: 70 });
P('hanging-cheesecloth-ghosts-c569cf', { at: [-9.6, 0, 5.4], ry: 45 });
P('giant-yard-spider-70ddce', { at: [8.4, 0, 7.6], ry: -130 });
P('giant-yard-inflatable-ff4573', { at: [-9.4, 0, 10.2], ry: 30 });
P('witch-crashed-into-a-b06bb6', { at: [12, 0, -4], ry: -60 });
P('halloween-yard-scarecrow-cb0ffb', { at: [11.6, 0, 11.8], ry: -40 });
P('tied-corn-stalk-bundle-c1d042', { at: [-4.2, 0, -9.6] });
P('tied-corn-stalk-bundle-c1d042', { at: [4.2, 0, -9.6] });
P('plywood-yard-silhouette-9071e1', { at: [-6.4, 0, 9.2], ry: 20 });
// the SHINE touch: a freshly detailed hearse parked by the party
P('vintage-hearse-3b2ec1', { at: [-12.4, 0, 14.2], ry: 125 });

// ---------- graveyard corner ----------
P('arched-cemetery-gate-bdca7c', { at: [-10, 0, 1.9] });
P('wrought-iron-cemetery-fence-f1a113', { at: [-14, 0, 1.9] });
P('wrought-iron-cemetery-fence-f1a113', { at: [-6, 0, -2.1], ry: 90 });
P('wrought-iron-cemetery-fence-f1a113', { at: [-6, 0, -6.1], ry: 90 });
P('family-mausoleum-c2a009', { at: [-12, 0, -8], ry: 30 });
P('weeping-stone-angel-644ce3', { at: [-8.2, 0, -7.2], ry: 20 });
P('skeleton-crawling-out-of-24b6ae', { at: [-8.4, 0, -1.6], ry: 10 });
P('grave-mound-169ec3', { at: [-11.6, 0, -2.4], ry: 90 });
P('grave-mound-169ec3', { at: [-9, 0, -4.2], ry: 90 });
for (const [x, z] of [[-11.6, -3.6], [-9, -5.4], [-13.2, -4.8], [-7.6, -4.2]]) P('carved-headstone-09d9f8', { at: [x, 0, z], ry: (x * 7) % 15 });
P('crow-194434', { at: [-10.6, 3.6, 1.95], ry: 80 });
P('crow-194434', { at: [-13.2, 1.5, 1.95], ry: -60 });

// ---------- lights that move ----------
const cauldronLight = new THREE.PointLight(0x6dff7a, 6, 9, 1.6);
cauldronLight.position.set(-5.6, 1.6, 2.6);
const floorLight = new THREE.PointLight(0xff8a2a, 10, 14, 1.4);
floorLight.position.set(0, 3.2, 0);
const purpleLight = new THREE.PointLight(0x9b5cff, 8, 16, 1.4);
purpleLight.position.set(0, 4, -3);
const porchLight = new THREE.PointLight(0xffb347, 8, 16, 1.6);
porchLight.position.set(0, 3, -10);
scene.add(cauldronLight, floorLight, purpleLight, porchLight);

// bats circling the house
const bats = new THREE.Group();
const batGeo = new THREE.BufferGeometry();
batGeo.setAttribute('position', new THREE.Float32BufferAttribute([
  0, 0, 0.12,  -0.45, 0.08, -0.05,  0, 0, -0.12,
  0, 0, 0.12,  0, 0, -0.12,  0.45, 0.08, -0.05,
], 3));
batGeo.computeVertexNormals();
const batMat = new THREE.MeshBasicMaterial({ color: 0x0b0710, side: THREE.DoubleSide, fog: false });
for (let i = 0; i < 18; i++) {
  const b = new THREE.Mesh(batGeo.clone(), batMat);
  b.userData = { r: 5 + Math.random() * 9, h: 7 + Math.random() * 8, s: 0.25 + Math.random() * 0.35, o: Math.random() * Math.PI * 2, f: 10 + Math.random() * 6 };
  bats.add(b);
}
bats.position.set(0, 0, -16);
scene.add(bats);

// low ground fog drifting over the dance floor
const fogTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'); const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();
const mist = [];
for (let i = 0; i < 26; i++) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: fogTex, color: 0xb9a6d8, transparent: true, opacity: 0.22, depthWrite: false }));
  const s = 3 + Math.random() * 4;
  sp.scale.set(s, s * 0.45, 1);
  sp.userData = { x: (Math.random() - 0.5) * 18, z: (Math.random() - 0.5) * 18, sp: 0.15 + Math.random() * 0.25, o: Math.random() * 10 };
  sp.position.set(sp.userData.x, 0.35, sp.userData.z);
  scene.add(sp); mist.push(sp);
}

// ---------- UI ----------
const danceRow = document.getElementById('dances');
for (const d of DANCES) {
  const b = document.createElement('button');
  b.textContent = d; b.setAttribute('aria-pressed', String(d === currentDance));
  b.onclick = () => {
    currentDance = d;
    danceRow.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    dancers.forEach((a) => a.play(d, { fade: 0.4 }));
  };
  danceRow.appendChild(b);
}
const SKIES = { 'Midnight': 'night', 'Full moon': 'moonlit', 'Dusk': 'dusk' };
const skyRow = document.getElementById('skies');
for (const [label, t] of Object.entries(SKIES)) {
  const b = document.createElement('button');
  b.textContent = label; b.setAttribute('aria-pressed', String(t === 'night'));
  b.onclick = () => {
    look.setTime(t);
    skyRow.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  };
  skyRow.appendChild(b);
}
const spin = document.getElementById('spin');
spin.onclick = () => { controls.autoRotate = !controls.autoRotate; spin.setAttribute('aria-pressed', String(controls.autoRotate)); };

const toast = document.getElementById('toast');
let flashUntil = 0, hemiBase = null;
document.getElementById('treat').onclick = () => {
  const lines = ['Happy Halloween!', 'Boo! 👻', 'Trick or treat!', 'Candy for everyone!', 'The house is watching…'];
  toast.textContent = lines[Math.floor(Math.random() * lines.length)];
  toast.style.opacity = 1;
  setTimeout(() => (toast.style.opacity = 0), 1600);
  flashUntil = clock.elapsedTime + 1.2; // lightning
  dancers.forEach((a) => a.play('Hip hop', { fade: 0.2 }));
  setTimeout(() => dancers.forEach((a) => a.play(currentDance, { fade: 0.4 })), 2400);
};

// ---------- go ----------
const clock = new THREE.Clock();
const loading = document.getElementById('loading');
Promise.allSettled(jobs).then(() => {
  loading.style.opacity = 0;
  setTimeout(() => loading.remove(), 700);
});
// never trap people behind the loading screen if a model is slow
setTimeout(() => { if (loading.isConnected) { loading.style.opacity = 0; setTimeout(() => loading.remove(), 700); } }, 15000);

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  for (const m of mixers) m.update(dt);

  // flicker candles + party lights
  const flick = 0.85 + Math.sin(t * 13) * 0.06 + Math.sin(t * 7.3) * 0.05 + Math.random() * 0.06;
  for (const m of glowMaterials) m.color.copy(m.userData.base).multiplyScalar(flick);
  cauldronLight.intensity = 5 + Math.sin(t * 3) * 1.5 + Math.random();
  floorLight.color.setHSL(0.07 + Math.sin(t * 0.8) * 0.03, 1, 0.55);
  purpleLight.intensity = 6 + Math.sin(t * 2.2) * 3;

  // lightning on trick-or-treat
  if (t < flashUntil) {
    if (hemiBase === null) hemiBase = look.hemi.intensity;
    look.hemi.intensity = Math.random() > 0.5 ? 4 : hemiBase;
  } else if (hemiBase !== null) { look.hemi.intensity = hemiBase; hemiBase = null; }

  for (const b of bats.children) {
    const u = b.userData, a = u.o + t * u.s;
    b.position.set(Math.cos(a) * u.r, u.h + Math.sin(t * 1.3 + u.o) * 0.6, Math.sin(a) * u.r);
    b.rotation.y = -a;
    b.scale.y = 0.4 + Math.abs(Math.sin(t * u.f)) * 1.2;
  }
  for (const s of mist) {
    const u = s.userData;
    s.position.x = u.x + Math.sin(t * u.sp + u.o) * 2.5;
    s.position.z = u.z + Math.cos(t * u.sp * 0.8 + u.o) * 2.5;
  }

  controls.update();
  look.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
